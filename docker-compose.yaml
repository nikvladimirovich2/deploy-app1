services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.1}
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - ./scripts:/scripts:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: arklan/faoapp_flask:28
    container_name: app1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${POSTGRES_PASS}
      DB_TABLE: users
    volumes:
      - ./main.py:/app/flask/main.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:4000"
      - "8000:8000"